<!DOCTYPE html>

<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Mochi's Restaurant
    </title>

    <link
        rel="stylesheet"
        href="css/menu.css"
    >

</head>


<body>


    <!-- =========================
         RESTAURANT HEADER
    ========================== -->

    <header class="restaurant-hero">

        <div class="hero-overlay">

            <h1 class="restaurant-name">
                Mochi's Restaurant
            </h1>

            <p class="restaurant-tagline">
                Ẩm thực giới thượng lưu
            </p>

            <p class="restaurant-description">
                Trải nghiệm ẩm thực tinh tế với những món ăn
                được chọn lọc và phục vụ dành riêng cho bạn.
            </p>

        </div>

    </header>



    <!-- =========================
         MAIN MENU
    ========================== -->

    <main class="page-container">

        <h1 id="menu-title">
            Online Menu
        </h1>


        <!-- Danh sách món ăn -->

        <div id="menu-container">

            Đang tải menu...

        </div>



        <!-- =========================
             CART / ORDER
        ========================== -->

        <section class="order-section">

            <h2>
                Đơn hàng của bạn
            </h2>


            <div id="cart-container">

                Chưa chọn món.

            </div>


            <button id="submit-order">

                Đặt món

            </button>

        </section>

    </main>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="js/menu.js"></script>


</body>

</html>
