<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mochi's Restaurant</title>

    <link rel="stylesheet" href="css/menu.css">
</head>

<body>
    <!-- RESTAURANT HEADER -->
    <header class="restaurant-hero">
        <div class="hero-overlay">
            <h1 class="restaurant-name">
                Mochi's Restaurant
            </h1>

            <p class="restaurant-tagline">
                Ẩm thực giới thượng lưu
            </p>

            <p class="restaurant-description">
                Trải nghiệm ẩm thực tinh tế với những món ăn
                được chọn lọc và phục vụ dành riêng cho bạn.
            </p>
        </div>
    </header>

    <!-- MAIN MENU -->
    <main class="page-container">
        <h1 id="menu-title">
            Menu
        </h1>

        <div id="menu-container">
            Đang tải menu...
        </div>

        <!-- CART / ORDER -->
        <section
            class="order-section"
            id="your-order"
            aria-labelledby="order-title"
        >
            <div class="order-heading">
                <h2 id="order-title">
                    Đơn hàng của bạn
                </h2>

                <span id="cart-count" class="cart-count">
                    0 phần
                </span>
            </div>

            <p class="order-help">
                Điều chỉnh số lượng hoặc xóa món trước khi gửi đến bếp.
            </p>

            <div id="cart-container">
                Chưa chọn món.
            </div>

            <div class="cart-total">
                <span>Tổng cộng</span>
                <strong id="cart-total">0đ</strong>
            </div>

            <p
                id="cart-status"
                class="cart-status"
                role="status"
                aria-live="polite"
            ></p>

            <button id="submit-order" type="button" disabled>
                Đặt món
            </button>
        </section>
    </main>

    <script src="js/menu.js"></script>
</body>
</html>
